name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The unit tests are pure Python; no model weights, datasets or GPU needed.
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Check that every Python file parses
        run: python -c "import ast, glob; [ast.parse(open(f).read(), f) for f in glob.glob('**/*.py', recursive=True)]; print('ok')"
      - name: Summarise released results (stdlib only)
        run: |
          python scripts/summarize_main_results.py > /dev/null
          python scripts/analyze_results.py results/medqa_marginal_v1 > /dev/null
